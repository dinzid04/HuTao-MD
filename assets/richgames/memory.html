<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Flip</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#171412;--card:#26201c;--back:#332b26;--line:#473d36;--ink:#faf7f5;--muted:#b4a79e;--accent:#eab308;--ok:#22c55e}
html,body{background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{width:100%;max-width:380px;margin:0 auto;padding:12px}
.shell{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
h1{font-size:19px;font-weight:800}
.hud{display:flex;gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-align:center;min-width:62px}
.stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:15px;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.modes{display:flex;gap:6px}
.btn{min-height:40px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#1c1917}
.btn-reset{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;aspect-ratio:1/1;min-height:66px;border-radius:10px;background:var(--back);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .2s ease,background .2s ease,border-color .2s ease}
.tile:active{transform:scale(.96)}
.tile .mark{width:18px;height:18px;border:2px solid #5c5048;transform:rotate(45deg);border-radius:3px}
.tile .sym{display:none;width:36px;height:36px}
.tile.open,.tile.matched{background:var(--card);border-color:var(--accent)}
.tile.open .mark,.tile.matched .mark{display:none}
.tile.open .sym,.tile.matched .sym{display:block}
.tile.matched{border-color:var(--ok);background:#15251a}
.banner{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner.win{border-color:var(--ok);color:#bbf7d0}
@media(prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<main>
  <section class="shell" aria-label="Permainan Memory Flip">
    <header>
      <h1>Memory Flip</h1>
      <div class="hud">
        <div class="stat"><span>Langkah</span><strong id="moves">0</strong></div>
        <div class="stat"><span>Cocok</span><strong id="pairs">0/8</strong></div>
      </div>
    </header>
    <div class="bar">
      <div class="modes">
        <button class="btn" type="button" data-pairs="6">12 Kartu</button>
        <button class="btn active" type="button" data-pairs="8">16 Kartu</button>
      </div>
      <button id="resetBtn" class="btn btn-reset" type="button">Acak Ulang</button>
    </div>
    <div id="grid" class="grid" role="grid"></div>
    <div id="banner" class="banner" role="status" aria-live="polite">
      <span id="msg">Temukan semua pasangan simbol geometris.</span>
      <strong id="time">00:00</strong>
    </div>
  </section>
</main>
<script>
(() => {
  const ICONS = [
    { name: 'Lingkaran', svg: '<svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="11" stroke="#f59e0b" stroke-width="3.5"/></svg>' },
    { name: 'Segitiga', svg: '<svg viewBox="0 0 36 36" fill="none"><polygon points="18,6 30,28 6,28" stroke="#38bdf8" stroke-width="3.2" stroke-linejoin="round"/></svg>' },
    { name: 'Wajik', svg: '<svg viewBox="0 0 36 36" fill="none"><polygon points="18,5 31,18 18,31 5,18" stroke="#f43f5e" stroke-width="3.2" stroke-linejoin="round"/></svg>' },
    { name: 'Silang', svg: '<svg viewBox="0 0 36 36" fill="none"><path d="M9 9L27 27M27 9L9 27" stroke="#4ade80" stroke-width="3.6" stroke-linecap="round"/></svg>' },
    { name: 'Heksagon', svg: '<svg viewBox="0 0 36 36" fill="none"><polygon points="18,5 29,11.5 29,24.5 18,31 7,24.5 7,11.5" stroke="#c084fc" stroke-width="3.2" stroke-linejoin="round"/></svg>' },
    { name: 'Bulan', svg: '<svg viewBox="0 0 36 36" fill="none"><path d="M24 25A11 11 0 1 1 15 7a9 9 0 0 0 9 18Z" stroke="#fde047" stroke-width="3" stroke-linejoin="round"/></svg>' },
    { name: 'Gelombang', svg: '<svg viewBox="0 0 36 36" fill="none"><path d="M5 18c3-7 6-7 9 0s6 7 9 0 6-7 8 0" stroke="#2dd4bf" stroke-width="3.4" stroke-linecap="round"/></svg>' },
    { name: 'Perisai', svg: '<svg viewBox="0 0 36 36" fill="none"><path d="M18 5l11 4v8c0 7-4.5 11.5-11 14-6.5-2.5-11-7-11-14V9l11-4Z" stroke="#fb923c" stroke-width="3" stroke-linejoin="round"/></svg>' }
  ];

  const gridEl = document.getElementById('grid');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const msgEl = document.getElementById('msg');
  const timeEl = document.getElementById('time');
  const banner = document.getElementById('banner');
  const resetBtn = document.getElementById('resetBtn');

  let pairCount = 8, deck = [], opened = [], locked = false, moves = 0, matched = 0, secs = 0, tId = null;

  function fmt(s) {
    return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }

  function startTimer() {
    if (tId) return;
    tId = setInterval(() => { secs++; timeEl.textContent = fmt(secs); }, 1000);
  }

  function render() {
    gridEl.innerHTML = '';
    movesEl.textContent = String(moves);
    pairsEl.textContent = matched + '/' + pairCount;
    deck.forEach((card, i) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tile' + (card.open ? ' open' : '') + (card.matched ? ' matched' : '');
      btn.setAttribute('aria-label', card.open || card.matched ? card.icon.name : 'Kartu tertutup');
      btn.innerHTML = '<span class="mark" aria-hidden="true"></span><span class="sym" aria-hidden="true">' + card.icon.svg + '</span>';
      btn.addEventListener('click', () => flip(i));
      gridEl.appendChild(btn);
    });
  }

  function flip(i) {
    const card = deck[i];
    if (locked || card.open || card.matched) return;
    startTimer();
    card.open = true;
    opened.push(i);
    render();

    if (opened.length === 2) {
      moves++;
      locked = true;
      const [a, b] = opened;
      if (deck[a].id === deck[b].id) {
        deck[a].matched = true;
        deck[b].matched = true;
        matched++;
        opened = [];
        locked = false;
        if (matched === pairCount) {
          clearInterval(tId);
          banner.classList.add('win');
          msgEl.textContent = 'Selesai dalam ' + moves + ' langkah!';
        }
        render();
      } else {
        setTimeout(() => {
          deck[a].open = false;
          deck[b].open = false;
          opened = [];
          locked = false;
          render();
        }, 650);
      }
    }
  }

  function init() {
    clearInterval(tId);
    tId = null; secs = 0; moves = 0; matched = 0; opened = []; locked = false;
    timeEl.textContent = '00:00';
    banner.classList.remove('win');
    msgEl.textContent = 'Temukan semua pasangan simbol geometris.';
    const chosen = ICONS.slice(0, pairCount);
    deck = [...chosen, ...chosen]
      .map((icon, idx) => ({ id: icon.name, icon, open: false, matched: false, r: Math.random() + idx * 0 }))
      .sort(() => Math.random() - 0.5);
    render();
  }

  document.querySelectorAll('[data-pairs]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-pairs]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      pairCount = parseInt(btn.dataset.pairs, 10) || 8;
      init();
    });
  });
  resetBtn.addEventListener('click', init);
  init();
})();
</script>
</body>
</html>
