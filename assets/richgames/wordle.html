<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katla ID</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#121213;--card:#1a1a1d;--line:#3a3a3c;--ink:#f8fafc;--muted:#a1a1aa;--hit:#538d4e;--near:#b59f3b;--miss:#3a3a3c}
html,body{background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid #f8fafc;outline-offset:2px}
main{width:100%;max-width:390px;margin:0 auto;padding:10px}
.shell{background:var(--bg);border:1px solid #2b2b2e;border-radius:14px;padding:14px 10px}
header{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;border-bottom:1px solid #27272a;margin-bottom:10px;gap:8px}
h1{font-size:19px;font-weight:800;letter-spacing:0.06em}
.right{display:flex;gap:8px;align-items:center}
.streak{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn-new{min-height:36px;padding:0 12px;border-radius:8px;background:#27272a;border:1px solid #3f3f46;font-size:12px;font-weight:700}
.msg{text-align:center;font-size:13px;font-weight:600;color:#e4e4e7;min-height:22px;margin-bottom:8px}
.board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;max-width:290px;margin:0 auto 12px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cell{aspect-ratio:1/1;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;text-transform:uppercase;color:var(--ink)}
.cell.filled{border-color:#71717a}
.cell.hit{background:var(--hit);border-color:var(--hit)}
.cell.near{background:var(--near);border-color:var(--near)}
.cell.miss{background:var(--miss);border-color:var(--miss)}
.kb{display:flex;flex-direction:column;gap:6px}
.kb-row{display:flex;justify-content:center;gap:4px}
.key{min-height:44px;min-width:29px;flex:1;max-width:36px;border-radius:6px;background:#565758;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.key.wide{max-width:58px;flex:1.5;font-size:11px;background:#3f3f46}
.key.hit{background:var(--hit)}
.key.near{background:var(--near)}
.key.miss{background:#27272a;color:#71717a}
.key:active{opacity:.8}
</style>
</head>
<body>
<main>
  <section class="shell" aria-label="Permainan Tebak Kata 5 Huruf">
    <header>
      <h1>KATLA ID</h1>
      <div class="right">
        <span class="streak">Menang: <strong id="wins">0</strong></span>
        <button id="newBtn" class="btn-new" type="button">Kata Baru</button>
      </div>
    </header>
    <p id="msg" class="msg" role="status" aria-live="polite">Tebak kata Bahasa Indonesia (5 huruf).</p>
    <div id="board" class="board" role="grid" aria-label="Papan tebakan 6 baris"></div>
    <div id="kb" class="kb" aria-label="Keyboard huruf"></div>
  </section>
</main>
<script>
(() => {
  // Daftar kata sehari-hari Bahasa Indonesia (tepat 5 huruf)
  const TARGETS = [
    'ANGIN','BAGUS','BAHAN','BAKAR','BALIK','BANTU','BARAT','BASAH','BATAS','BAWAH','BAYAR','BEBAS','BEKAL','BELAH','BELUM','BENAR','BENDA','BERAS','BERAT','BESAR',
    'BETUL','BIASA','BIJAK','BIKIN','BUBUR','BUKAN','BUKIT','BULAN','BULAT','BUMBU','BUNGA','BURUK','BUTUH','CAKRA','CALON','CAPAI','CATAT','CEPAT','CERAH','CERIA',
    'CINTA','CIPTA','COCOK','CORAK','CUACA','CUKUP','CURAH','DADAR','DAHAN','DALAM','DAMAI','DANAU','DAPAT','DAPUR','DARAH','DARAT','DASAR','DATAR','DEKAT','DEMAM',
    'DENDA','DERAS','DETIK','DUNIA','EMPAT','ENTAH','FAJAR','FAKTA','FOKUS','GAJAH','GALAU','GANTI','GARAM','GARIS','GATAL','GELAP','GELAS','GEMAR','GEMPA','GEMUK',
    'GENAP','GERAK','GETAR','GIGIH','GILIR','GITAR','GOSOK','GUBUK','GUGUR','GULAI','GURAU','GURUN','HABIS','HADIR','HAFAL','HALAL','HALUS','HAMBA','HANYA','HAPUS',
    'HARAP','HARGA','HARUM','HASIL','HEBAT','HEMAT','HENTI','HEWAN','HIDUP','HIJAU','HILIR','HITAM','HUJAN','HUKUM','HUTAN','IKRAR','ILHAM','IMBAS','INDAH','INDUK',
    'INGAT','INGIN','INJAK','INTAN','INTIP','IRAMA','ISIAN','ISTRI','JABAT','JAGAT','JAHAT','JAHIT','JAKSA','JALAN','JALUR','JAMBU','JAMUR','JANJI','JARAK','JARUM',
    'JATAH','JATUH','JAWAB','JEJAK','JELAS','JEMUR','JENIS','JENUH','JEPIT','JERAT','JERUK','JILID','JINAK','JODOH','JOGET','JUARA','JUDUL','JUJUR','JUMAT','JUMPA',
    'JURUS','KABAR','KABEL','KABUR','KABUT','KACAU','KADAR','KAGET','KAGUM','KAKAK','KALAH','KALAU','KALBU','KAMAR','KAMIS','KANAN','KAPAL','KAPAN','KAPAS','KAPUR',
    'KARAM','KARAT','KARET','KARIR','KARMA','KARYA','KASAR','KASIH','KASUR','KATAK','KATUN','KAWAL','KAWAN','KAWAT','KAWIN','KAYUH','KEBAL','KEBUN','KECAP','KECIL',
    'KEDAI','KEJAM','KEJAR','KEJUT','KEKAL','KELAM','KELAS','KELUH','KEMAH','KEMAS','KENAL','KEPAL','KERAH','KERAK','KERAN','KERAS','KEREN','KERJA','KERUH','KESAL',
    'KESAN','KETAT','KETIK','KETUA','KETUK','KIBAR','KICAU','KIDAL','KIKIR','KILAP','KILAS','KILAT','KILAU','KIMIA','KIPAS','KIRIM','KISAH','KITAB','KLAIM','KOBAR',
    'KOCAK','KOCOK','KODOK','KOKOH','KOLAM','KOLOM','KOMIK','KONON','KORAN','KOREK','KOTAK','KOTOR','KOYAK','KUASA','KUBAH','KUBUR','KUDUS','KUKUH','KUKUS','KULIT',
    'KUMAL','KUMAN','KUMIS','KUMUH','KUMUR','KUNCI','KUPAS','KUPON','KURAS','KURIR','KURMA','KURSI','KURUS','KUSEN','KUSIR','KUSUT','KUTIP','KUTUB','KUTUK','LABUH',
    'LACAK','LAFAL','LAHAN','LAHAR','LAHIR','LAJUR','LAKON','LALAI','LALAT','LAMAR','LAMPU','LAPAK','LAPAR','LAPIS','LAPOR','LAPUK','LARAS','LARIS','LARUT','LASER',
    'LATAR','LATIH','LAWAK','LAWAN','LAWAS','LAYAK','LAYAN','LAYAR','LAZIM','LEBAH','LEBAM','LEBAR','LEBAT','LEBIH','LEBUR','LECET','LEDAK','LEGAL','LEGIT','LEHER',
    'LEKAS','LEKAT','LEKUK','LELAH','LELAP','LELEH','LEMAH','LEMAK','LEMAS','LEMBU','LEMON','LENSA','LEPAS','LERAI','LETAK','LETIH','LETUP','LETUS','LEVEL','LEWAT',
    'LEZAT','LIANG','LIBAS','LIBAT','LIBUR','LICIK','LICIN','LIDAH','LIHAI','LIHAT','LILIN','LILIT','LIMAS','LIMAU','LINDU','LIPAN','LIPAS','LIPAT','LIPUT','LIRIH',
    'LIRIK','LISAN','LITER','LOBAK','LOGAM','LOGAT','LOGIS','LOKAL','LOKET','LOLOS','LOMBA','LORON','LOTRE','LOTUS','LOYAL','LUANG','LUBUK','LUDAH','LUDES','LUGAS',
    'LUHUR','LUKIS','LULUH','LULUR','LULUS','LUMAT','LUMBA','LUMER','LUMUR','LUMUT','LUNAK','LUNAS','LUPUT','LURAH','LURIK','LURUH','LURUS','LUSIN','LUSUH','LUTUT',
    'LUWES','MABUK','MACAM','MACAN','MACET','MAFIA','MAGIS','MAGMA','MAHAL','MAHAR','MAHIR','MAKAM','MAKAN','MAKAR','MAKET','MAKIN','MAKNA','MAKRO','MALAH','MALAM',
    'MALAS','MAMPU','MANIA','MANIK','MANIS','MANJA','MAPAN','MARAH','MARAK','MARET','MARGA','MARKA','MASAK','MASAL','MASAM','MASIF','MASIH','MASIN','MASSA','MASUK',
    'MATRA','MAWAR','MAWAS','MAYAT','MAYOR','MAYUR','MEBEL','MEDAN','MEDIA','MEDIS','MEGAH','MEKAR','MELAR','MELON','MEMAR','MENIT','MENOR','MEPET','MERAH','MERAK',
    'MERCU','MERDU','MEREK','MESIN','MESKI','MESRA','MESTI','MESUM','METAL','METER','METRO','MEWAH','MIKRO','MILAD','MILIK','MIMIK','MIMPI','MINAT','MINIM','MINOR',
    'MINTA','MINUM','MINUS','MIRAS','MIRIP','MIRIS','MISAL','MISIL','MITOS','MITRA','MOBIL','MODAL','MODEL','MODEM','MODIS','MODUL','MODUS','MOGOK','MOHON','MOLEK',
    'MOLOR','MOMEN','MOMOK','MORAL','MORIL','MORSE','MOTEL','MOTIF','MOTOR','MUARA','MUBAH','MUDIK','MUJUR','MUKIM','MULAI','MULAS','MULIA','MULUK','MULUR','MULUS',
    'MULUT','MUMET','MURAD','MURAH','MURAI','MURAL','MURAM','MURID','MURKA','MURNI','MUSIK','MUSIM','MUSUH','MUTAN','NABAT','NADAR','NADIR','NAFAS','NAFSU','NAHAS',
    'NAJIS','NAKAL','NALAR','NAMUN','NANAH','NANAR','NANAS','NANTI','NAPAL','NAPAS','NASAB','NASIB','NATAL','NAUNG','NAZAR','NAZIR','NECIS','NEKAT','NENEK','NETRA',
    'NETTO','NGACO','NGAJI','NGAKU','NIAGA','NIFAS','NIHIL','NIKAH','NIKEL','NILAI','NILAM','NILON','NINJA','NIPAH','NIPIS','NISAN','NISBI','NISTA','NOBAT','NOBEL',
    'NOMAD','NOMOR','NORAK','NORMA','NOTES','NOVEL','NUJUM','NUKIL','NYALA','NYALI','NYATA','NYAWA','NYERI','NYIUR','OBENG','OBJEK','OBRAL','OBROL','OKNUM','OKTAF',
    'OKTAN','OLENG','OMBAK','OMEGA','OMONG','OMPOL','OMSET','OMZET','ONCOM','OPERA','OPINI','OPIUM','OPLOS','OPTIK','OPTIS','ORANG','ORASI','ORBIT','ORDER','ORGAN',
    'ORKES','OSENG','OVARI','OVASI'
  ];

  const KB_ROWS = ['QWERTYUIOP', 'ASDFGHJKL', 'ENTER,Z,X,C,V,B,N,M,HAPUS'];
  const boardEl = document.getElementById('board');
  const kbEl = document.getElementById('kb');
  const msgEl = document.getElementById('msg');
  const winsEl = document.getElementById('wins');
  const newBtn = document.getElementById('newBtn');

  let secret = '', row = 0, col = 0, grid = [], states = [], keyState = {}, over = false, wins = 0;
  try { wins = parseInt(localStorage.getItem('shiki_katla_wins') || '0', 10) || 0; } catch {}
  winsEl.textContent = String(wins);

  const RANK = { miss: 1, near: 2, hit: 3 };

  function renderBoard() {
    boardEl.innerHTML = '';
    for (let r = 0; r < 6; r++) {
      const rEl = document.createElement('div');
      rEl.className = 'row';
      for (let c = 0; c < 5; c++) {
        const d = document.createElement('div');
        const ch = grid[r][c];
        const st = states[r][c];
        d.className = 'cell' + (ch && !st ? ' filled' : '') + (st ? ' ' + st : '');
        d.textContent = ch;
        rEl.appendChild(d);
      }
      boardEl.appendChild(rEl);
    }
  }

  function renderKb() {
    kbEl.innerHTML = '';
    KB_ROWS.forEach(line => {
      const rEl = document.createElement('div');
      rEl.className = 'kb-row';
      const keys = line.includes(',') ? line.split(',') : line.split('');
      keys.forEach(k => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'key' + (k.length > 1 ? ' wide' : '') + (keyState[k] ? ' ' + keyState[k] : '');
        b.textContent = k === 'HAPUS' ? 'DEL' : k;
        b.addEventListener('click', () => handleKey(k));
        rEl.appendChild(b);
      });
      kbEl.appendChild(rEl);
    });
  }

  function submit() {
    if (col < 5) {
      msgEl.textContent = 'Isi 5 huruf dulu sebelum menekan ENTER.';
      return;
    }
    const guess = grid[row].join('');
    const res = Array(5).fill('miss');
    const remain = secret.split('');

    for (let i = 0; i < 5; i++) {
      if (guess[i] === secret[i]) {
        res[i] = 'hit';
        remain[i] = null;
      }
    }
    for (let i = 0; i < 5; i++) {
      if (res[i] === 'hit') continue;
      const idx = remain.indexOf(guess[i]);
      if (idx !== -1) {
        res[i] = 'near';
        remain[idx] = null;
      }
    }

    states[row] = res;
    for (let i = 0; i < 5; i++) {
      const ch = guess[i];
      if (!keyState[ch] || RANK[res[i]] > RANK[keyState[ch]]) keyState[ch] = res[i];
    }

    if (guess === secret) {
      over = true;
      wins++;
      winsEl.textContent = String(wins);
      try { localStorage.setItem('shiki_katla_wins', String(wins)); } catch {}
      msgEl.textContent = 'Benar! Kata "' + secret + '" tertebak di percobaan ke-' + (row + 1) + '.';
    } else if (row === 5) {
      over = true;
      msgEl.textContent = 'Kesempatan habis. Jawabannya: ' + secret + '.';
    } else {
      row++;
      col = 0;
      msgEl.textContent = 'Percobaan ' + (row + 1) + ' dari 6.';
    }
    renderBoard();
    renderKb();
  }

  function handleKey(k) {
    if (over) return;
    if (k === 'HAPUS' || k === 'BACKSPACE') {
      if (col > 0) { col--; grid[row][col] = ''; renderBoard(); }
      return;
    }
    if (k === 'ENTER') return submit();
    if (/^[A-Z]$/.test(k) && col < 5) {
      grid[row][col] = k;
      col++;
      renderBoard();
    }
  }

  function init() {
    secret = TARGETS[Math.floor(Math.random() * TARGETS.length)];
    row = 0; col = 0; over = false; keyState = {};
    grid = Array.from({ length: 6 }, () => Array(5).fill(''));
    states = Array.from({ length: 6 }, () => Array(5).fill(''));
    msgEl.textContent = 'Tebak kata Bahasa Indonesia (5 huruf).';
    renderBoard();
    renderKb();
  }

  newBtn.addEventListener('click', init);
  window.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleKey('ENTER');
    else if (e.key === 'Backspace') handleKey('HAPUS');
    else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
  });
  init();
})();
</script>
</body>
</html>
