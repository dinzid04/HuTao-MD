<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sudoku 9x9 — HuTao - MD</title>
<style>

:root{
  --bg:#0f172a;--card:#18243d;--card2:#213052;--ink:#f8fafc;--soft:#94a3b8;
  --line:#30436e;--acc:#3b82f6;--acc2:#2563eb;--warn:#fbbf24;--red:#ef4444;--blue:#3b82f6;
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:transparent;color:var(--ink);font-family:var(--sys);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0;width:100%;}
.app{
  width:100%;max-width:100%;border-radius:14px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 85% 0%,rgba(59,130,246,.18) 0%,transparent 48%),
             radial-gradient(circle at 10% 100%,rgba(99,102,241,.12) 0%,transparent 52%),
             linear-gradient(180deg,#16223b 0%,#0f172a 100%);
  border:1px solid #30436e;
  box-shadow:0 16px 36px rgba(0,0,0,.6);
  padding:10px;
}
.top{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#2563eb);
  color:#fff;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.meta{min-width:0;flex:1;}
.title{font-size:14.5px;font-weight:800;letter-spacing:.2px;color:var(--ink);}
.sub{font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.btn{border:0;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;}
.btn.alt{background:var(--card2);color:var(--ink);border:1px solid var(--line);}
.btn.red{background:#ef4444;color:#fff;}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;outline:none;font-family:var(--sys);}
.inp:focus{border-color:var(--acc);}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.row{display:flex;gap:8px;align-items:center;}
.muted{color:var(--soft);font-size:11px;}
.hide{display:none!important;}

.hud{display:flex;justify-content:space-between;gap:6px;margin-bottom:10px;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px;text-align:center;}
.stat b{display:block;font-size:15px;color:#fff;}
.stat span{font-size:10px;color:var(--soft);}
canvas{display:block;width:100%;border-radius:13px;background:#0b0714;border:1px solid var(--line);touch-action:none;}
.row{display:flex;gap:8px;margin-top:10px;}
.row .btn{flex:1;}
.sg{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:#3f2b5c;padding:4px;border-radius:12px;}
.sc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;background:#181026;color:#f472b6;cursor:pointer;}
.sc.fix{background:#231638;color:#fff;}
.sc.sel{background:#4c1d57;outline:2px solid #f472b6;}
.sc.bad{color:#fb7185;background:#3b1224;}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:9px;}
.nb{padding:8px 0;border-radius:9px;border:1px solid var(--line);background:var(--card);color:#fff;font-weight:800;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<div class="stage"><div class="app">
  <div class="top">
    <div class="logo">🔢</div>
    <div class="meta">
      <div class="title">Sudoku 9x9</div>
      <div class="sub">Isi kotak 1-9 tanpa angka kembar</div>
    </div>
  </div>
  <div class="hud">
    <div class="stat"><b id="st">Main</b><span>Status</span></div>
    <div class="stat"><b id="tm">00:00</b><span>Waktu</span></div>
  </div>
  <div class="sg" id="sg"></div>
  <div class="nums" id="nums"></div>
  <div class="row"><button class="btn alt" onclick="hint()">💡 Hint</button><button class="btn" onclick="newGame()">↻ Baru</button></div>
</div></div>
<script>
const BASE="534678912672195348198342567859761423426853791713924856961537284287419635345286179";
let sol=[],cur=[],fix=[],sel=-1,sec=0,tmr=null;
function newGame(){
  const map=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);
  sol=[...BASE].map(c=>map[+c-1]);
  cur=[...sol];fix=Array(81).fill(true);
  let rem=42;while(rem>0){const i=Math.floor(Math.random()*81);if(cur[i]){cur[i]=0;fix[i]=false;rem--;}}
  sel=-1;sec=0;clearInterval(tmr);
  tmr=setInterval(()=>{sec++;document.getElementById('tm').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');},1000);
  document.getElementById('st').textContent='Main';render();
}
function render(){
  document.getElementById('sg').innerHTML=cur.map((v,i)=>{
    const bad=v&&v!==sol[i];
    return `<div class="sc ${fix[i]?'fix':''} ${i===sel?'sel':''} ${bad?'bad':''}" onclick="pick(${i})">${v||''}</div>`;
  }).join('');
  if(cur.every((v,i)=>v===sol[i])){document.getElementById('st').textContent='SELESAI! 🎉';clearInterval(tmr);}
}
function pick(i){if(!fix[i]){sel=i;render();}}
function put(n){if(sel<0||fix[sel])return;cur[sel]=n;render();}
function hint(){const e=cur.map((v,i)=>v!==sol[i]?i:-1).filter(i=>i>=0);if(!e.length)return;const i=e[Math.floor(Math.random()*e.length)];cur[i]=sol[i];render();}
document.getElementById('nums').innerHTML=[1,2,3,4,5,6,7,8,9,0].map(n=>`<button class="nb" onclick="put(${n})">${n||'⌫'}</button>`).join('');
newGame();
</script>
</body>
</html>
