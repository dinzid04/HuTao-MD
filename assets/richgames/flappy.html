<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;
user-select:none;
}
html,body{
margin:0;
padding:0;
width:100%;
overflow:hidden;
background:transparent;
font-family:Arial,sans-serif;
touch-action:none;
}
.flappyWrap{
width:100%;
padding:6px;
margin:0;
overflow:hidden;
border:2px solid rgba(255,255,255,.7);
border-radius:18px;
background:linear-gradient(145deg,#58b9e8,#2386bd);
box-shadow:0 0 0 1px rgba(0,0,0,.12),0 4px 15px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.4);
}
.flappyHeader{
height:42px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
overflow:hidden;
border:1px solid rgba(255,255,255,.45);
border-radius:13px 13px 9px 9px;
margin-bottom:5px;
background:linear-gradient(180deg,#69c8f1,#3297ca);
box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.15);
}
.flappyHeaderTitle{
color:#fff;
font:bold 22px Arial,sans-serif;
letter-spacing:2px;
text-shadow:0 2px 0 #17658d,0 3px 5px rgba(0,0,0,.35);
}
.flappyHeaderTitle span{color:#ffd447;}
.flappyHeaderBird{
position:absolute;
font-size:19px;
text-shadow:0 2px 2px rgba(0,0,0,.25);
}
.flappyHeaderBird.left{left:12px;}
.flappyHeaderBird.right{right:12px;transform:scaleX(-1);}
.flappyGame{
position:relative;
width:100%;
height:210px;
overflow:hidden;
border:2px solid rgba(255,255,255,.75);
border-radius:14px;
background:#8fd8ff;
box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 7px rgba(0,0,0,.2);
}
#flappyCanvas{display:block;width:100%;height:100%;}
.flappyScore{
position:absolute;
top:9px;
left:0;
right:0;
z-index:5;
text-align:center;
color:#fff;
font:bold 25px Arial,sans-serif;
text-shadow:0 2px 3px rgba(0,0,0,.3);
pointer-events:none;
}
.flappyBest{
position:absolute;
top:39px;
left:0;
right:0;
z-index:5;
text-align:center;
color:rgba(255,255,255,.95);
font:bold 10px monospace;
text-shadow:0 1px 2px rgba(0,0,0,.3);
pointer-events:none;
}
.flappyStart{
position:absolute;
inset:0;
z-index:10;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(72,177,224,.22);
}
.flappyStart.hide{display:none;}
.flappyTitle{
color:#fff;
font:bold 24px Arial,sans-serif;
text-shadow:0 2px 4px rgba(0,0,0,.35);
margin-bottom:6px;
}
.flappyText{
color:#fff;
font:bold 11px monospace;
text-shadow:0 1px 3px rgba(0,0,0,.4);
padding:5px 12px;
border-radius:999px;
background:rgba(0,0,0,.22);
}
.flappyCountdown{
position:absolute;
inset:0;
z-index:15;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
pointer-events:none;
background:rgba(24,74,100,.14);
}
.flappyCountdown.show{display:flex;}
.flappyCountNum{
color:#ffe66a;
font:bold 42px Arial,sans-serif;
text-shadow:0 3px 0 #17658d,0 5px 12px rgba(0,0,0,.45);
line-height:1;
}
.flappyCountSub{
margin-top:6px;
color:#fff;
font:bold 10px monospace;
letter-spacing:1px;
text-shadow:0 1px 3px rgba(0,0,0,.45);
}
.flappyOver{
position:absolute;
inset:0;
z-index:20;
display:none;
align-items:center;
justify-content:center;
flex-direction:column;
background:rgba(24,74,100,.52);
}
.flappyOver.show{display:flex;}
.flappyOverTitle{
color:#fff;
font:bold 22px Arial,sans-serif;
text-shadow:0 2px 4px rgba(0,0,0,.5);
margin-bottom:5px;
}
.flappyFinal{
color:#fff;
font:bold 12px monospace;
text-shadow:0 1px 3px rgba(0,0,0,.5);
}
.flappyRestart{
margin-top:10px;
padding:8px 18px;
border:1px solid rgba(0,0,0,.08);
border-radius:8px;
background:#fff;
color:#2a7ca8;
font:bold 11px Arial,sans-serif;
box-shadow:0 2px 6px rgba(0,0,0,.18);
cursor:pointer;
}
.flappyHint{
position:absolute;
z-index:4;
bottom:6px;
left:0;
right:0;
text-align:center;
color:rgba(255,255,255,.82);
font:bold 9px monospace;
text-shadow:0 1px 2px rgba(0,0,0,.25);
pointer-events:none;
}
.flappyFooter{
height:34px;
display:flex;
align-items:center;
justify-content:space-between;
gap:6px;
margin-top:5px;
padding:0 9px;
border:1px solid rgba(255,255,255,.42);
border-radius:9px;
background:rgba(24,111,157,.55);
box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
}
.flappySound{color:#fff;font-size:17px;text-shadow:0 2px 3px rgba(0,0,0,.3);}
.flappyFooterText{color:#fff;font:bold 9px monospace;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.flappyFooterBest{color:#ffe66a;font:bold 10px monospace;text-shadow:0 1px 2px rgba(0,0,0,.3);}
</style>

<div class="flappyWrap">
<div class="flappyHeader">
<div class="flappyHeaderBird left">🐤</div>
<div class="flappyHeaderTitle">FLAPPY <span>BIRD</span></div>
<div class="flappyHeaderBird right">🐤</div>
</div>

<div class="flappyGame" id="flappyGame">
<div class="flappyScore" id="flappyScore">0</div>
<div class="flappyBest">BEST <span id="flappyBestValue">0</span></div>
<canvas id="flappyCanvas"></canvas>
<div class="flappyHint">TAP / SPACE TO FLY</div>

<div class="flappyStart" id="flappyStart">
<div class="flappyTitle">FLAPPY BIRD</div>
<div class="flappyText">TAP TO START</div>
</div>

<div class="flappyCountdown" id="flappyCountdown">
<div class="flappyCountNum" id="flappyCountNum">3</div>
<div class="flappyCountSub" id="flappyCountSub">BERSIAP...</div>
</div>

<div class="flappyOver" id="flappyOver">
<div class="flappyOverTitle">GAME OVER</div>
<div class="flappyFinal">SCORE <span id="flappyFinalScore">0</span></div>
<button class="flappyRestart" id="flappyRestart">PLAY AGAIN</button>
</div>
</div>

<div class="flappyFooter">
<div class="flappySound">🔊</div>
<div class="flappyFooterText">TAP TO FLY</div>
<div class="flappyFooterBest">BEST <span id="flappyFooterBest">0</span></div>
</div>
</div>

<script>
(function(){
const canvas=document.getElementById('flappyCanvas');
const ctx=canvas.getContext('2d');
const game=document.getElementById('flappyGame');

const scoreEl=document.getElementById('flappyScore');
const bestEl=document.getElementById('flappyBestValue');
const footerBestEl=document.getElementById('flappyFooterBest');

const startEl=document.getElementById('flappyStart');
const countdownEl=document.getElementById('flappyCountdown');
const countNumEl=document.getElementById('flappyCountNum');
const countSubEl=document.getElementById('flappyCountSub');
const overEl=document.getElementById('flappyOver');
const finalEl=document.getElementById('flappyFinalScore');
const restartEl=document.getElementById('flappyRestart');

let W=0,H=0,DPR=1;
// state: 'idle' | 'countdown' | 'ready_hover' | 'playing' | 'over'
let state='idle';
let countdownMs=0;
let countdownLastSec=0;
let graceHoverMs=0;

let score=0,best=0,speed=2.45,last=0,spawnTimer=0,frame=0;
let pipes=[],clouds=[],particles=[];
let audioCtx=null;
let rafId=0;

const groundHeight=22;
const GRAVITY=0.33;
const FLAP_VY=-5.8;

const bird={x:0,y:0,w:30,h:24,vy:0,rotation:0,wing:0};

try{
best=parseInt(localStorage.getItem('flappy_bird_best')||'0',10);
if(!Number.isFinite(best))best=0;
}catch(e){best=0;}

function initAudio(){
if(!audioCtx){
const AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;
audioCtx=new AC();
}
if(audioCtx.state==='suspended')audioCtx.resume();
}

function playTone(type,f1,f2,dur,vol){
initAudio();
if(!audioCtx)return;
const now=audioCtx.currentTime;
const osc=audioCtx.createOscillator();
const gain=audioCtx.createGain();
osc.type=type;
osc.frequency.setValueAtTime(f1,now);
osc.frequency.exponentialRampToValueAtTime(f2,now+dur*0.9);
gain.gain.setValueAtTime(.0001,now);
gain.gain.exponentialRampToValueAtTime(vol,now+.01);
gain.gain.exponentialRampToValueAtTime(.0001,now+dur);
osc.connect(gain);
gain.connect(audioCtx.destination);
osc.start(now);
osc.stop(now+dur+.02);
}

function playFlapSound(){playTone('square',500,740,.075,.065);}
function playScoreSound(){playTone('sine',760,1080,.11,.055);}
function playTickSound(go){playTone('sine',go?880:520,go?1180:520,.10,.05);}
function playGameOverSound(){playTone('sawtooth',420,110,.44,.11);}

function makeCloud(x,y,w,spd){
return{x,y,w,h:w*.42,speed:spd,alpha:.72+Math.random()*.16};
}

function resetClouds(){
clouds=[
makeCloud(W*.08,25,55,.20),
makeCloud(W*.48,55,70,.14),
makeCloud(W*.86,22,50,.22)
];
}

function resize(){
const r=game.getBoundingClientRect();
W=r.width;
H=r.height;
DPR=Math.min(window.devicePixelRatio||1,2);
canvas.width=Math.floor(W*DPR);
canvas.height=Math.floor(H*DPR);
canvas.style.width=W+'px';
canvas.style.height=H+'px';
ctx.setTransform(DPR,0,0,DPR,0,0);
bird.x=W*.22;
if(state==='idle'||state==='countdown'||state==='ready_hover'){
bird.y=H*.44;
}
if(!clouds.length)resetClouds();
draw();
}

function updateUI(){
scoreEl.textContent=String(Math.floor(score));
bestEl.textContent=String(Math.floor(best));
footerBestEl.textContent=String(Math.floor(best));
}

function startCountdown(){
initAudio();
score=0;
speed=2.45;
spawnTimer=115;
frame=0;
pipes=[];
particles=[];
resetClouds();

bird.x=W*.22;
bird.y=H*.44;
bird.vy=0;
bird.rotation=0;
bird.wing=0;

state='countdown';
countdownMs=2200;
countdownLastSec=3;
graceHoverMs=0;

startEl.classList.add('hide');
overEl.classList.remove('show');
countNumEl.textContent='3';
countSubEl.textContent='BERSIAP...';
countdownEl.classList.add('show');
playTickSound(false);
updateUI();

if(rafId)cancelAnimationFrame(rafId);
last=performance.now();
rafId=requestAnimationFrame(loop);
}

function beginActivePlay(withFlap){
state='playing';
countdownEl.classList.remove('show');
bird.vy=withFlap?FLAP_VY:-4.6;
playFlapSound();
createParticles(bird.x-2,bird.y+12,6);
}

function flap(){
initAudio();
if(state==='idle'||state==='over'){
startCountdown();
return;
}
// Saat jeda hitung mundur 3-2-1, tap diabaikan agar tidak langsung jatuh/mati
if(state==='countdown'){
return;
}
// Setelah "GO!" burung melayang aman menunggu tap pertama (atau 1.2 detik grace hover)
if(state==='ready_hover'){
beginActivePlay(true);
return;
}
bird.vy=FLAP_VY;
playFlapSound();
createParticles(bird.x-2,bird.y+12,5);
}

function createParticles(px,py,count){
for(let i=0;i<count;i++){
particles.push({
x:px,y:py,
vx:-Math.random()*1.5,
vy:(Math.random()-.5)*1.8,
life:1,size:1+Math.random()*2
});
}
}

function createPipe(){
const playableTop=30;
const playableBottom=H-groundHeight-16;
const gap=Math.max(76,94-score*.12);
const minTop=playableTop+16;
const maxTop=playableBottom-gap-16;
const topHeight=minTop+Math.random()*Math.max(10,maxTop-minTop);
pipes.push({x:W+24,w:34,top:topHeight,gap,passed:false});
}

function hit(a,b){
return(a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y);
}

function pipeCollision(p){
const birdBox={x:bird.x+6,y:bird.y+5,w:bird.w-11,h:bird.h-9};
const bottomY=p.top+p.gap;
const topPipe={x:p.x,y:0,w:p.w,h:p.top};
const bottomPipe={x:p.x,y:bottomY,w:p.w,h:H-groundHeight-bottomY};
return hit(birdBox,topPipe)||hit(birdBox,bottomPipe);
}

function drawSky(){
const g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,'#79cdf4');
g.addColorStop(.55,'#9fdef7');
g.addColorStop(1,'#c9f0ff');
ctx.fillStyle=g;
ctx.fillRect(0,0,W,H);
}

function drawCloud(c){
const {x,y,w,h}=c;
ctx.save();
ctx.globalAlpha=c.alpha;
ctx.fillStyle='#fff';
ctx.shadowColor='rgba(80,160,190,.12)';
ctx.shadowBlur=5;
ctx.shadowOffsetY=2;
ctx.beginPath();
ctx.moveTo(x+w*.10,y+h*.66);
ctx.bezierCurveTo(x+w*.02,y+h*.54,x+w*.07,y+h*.30,x+w*.27,y+h*.31);
ctx.bezierCurveTo(x+w*.30,y+h*.06,x+w*.45,y,x+w*.56,y+h*.10);
ctx.bezierCurveTo(x+w*.67,y+h*.05,x+w*.78,y+h*.17,x+w*.78,y+h*.34);
ctx.bezierCurveTo(x+w*.96,y+h*.30,x+w,y+h*.48,x+w*.94,y+h*.63);
ctx.bezierCurveTo(x+w*.91,y+h*.75,x+w*.76,y+h*.76,x+w*.62,y+h*.76);
ctx.lineTo(x+w*.22,y+h*.76);
ctx.bezierCurveTo(x+w*.12,y+h*.76,x+w*.07,y+h*.72,x+w*.10,y+h*.66);
ctx.closePath();
ctx.fill();
ctx.restore();
}

function drawPipe(p){
const {x,w}=p;
const bottomY=p.top+p.gap;
ctx.fillStyle='rgba(0,0,0,.12)';
ctx.fillRect(x+2,0,w,p.top);
ctx.fillRect(x+2,bottomY,w,H-groundHeight-bottomY);
const g=ctx.createLinearGradient(x,0,x+w,0);
g.addColorStop(0,'#2f9e55');
g.addColorStop(.45,'#64c96d');
g.addColorStop(1,'#247b46');
ctx.fillStyle=g;
ctx.fillRect(x,0,w,p.top);
ctx.fillRect(x,bottomY,w,H-groundHeight-bottomY);
ctx.fillStyle='#3da95a';
ctx.fillRect(x-4,p.top-10,w+8,10);
ctx.fillRect(x-4,bottomY,w+8,10);
ctx.fillStyle='rgba(255,255,255,.2)';
ctx.fillRect(x+5,0,4,Math.max(0,p.top-4));
ctx.fillRect(x+5,bottomY+10,4,Math.max(0,H-groundHeight-bottomY-10));
}

function drawBird(){
ctx.save();
ctx.translate(bird.x+bird.w/2,bird.y+bird.h/2);
ctx.rotate(bird.rotation);
ctx.fillStyle='#e7a72f';
ctx.beginPath();
ctx.moveTo(-14,-2);ctx.lineTo(-23,-8);ctx.lineTo(-19,3);ctx.lineTo(-24,8);ctx.lineTo(-13,6);
ctx.fill();
ctx.fillStyle='#ffd447';
ctx.beginPath();ctx.ellipse(0,1,15,11,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ffe99b';
ctx.beginPath();ctx.ellipse(3,5,9,6,0,0,Math.PI*2);ctx.fill();
const wingY=Math.sin(bird.wing)*4;
ctx.fillStyle='#eab02e';
ctx.beginPath();ctx.ellipse(-2,5+wingY*.25,9,5,-.25,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ffd447';
ctx.beginPath();ctx.arc(9,-5,10,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(13,-8,4,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#252525';
ctx.beginPath();ctx.arc(14,-8,2,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#f08a24';
ctx.beginPath();ctx.moveTo(17,-3);ctx.lineTo(28,1);ctx.lineTo(17,5);ctx.closePath();ctx.fill();
ctx.strokeStyle='#c96a1a';
ctx.lineWidth=1;
ctx.beginPath();ctx.moveTo(18,1);ctx.lineTo(27,1);ctx.stroke();
ctx.restore();
}

function drawGround(){
const gy=H-groundHeight;
ctx.fillStyle='#7fcf57';
ctx.fillRect(0,gy,W,5);
ctx.fillStyle='#d6b45c';
ctx.fillRect(0,gy+5,W,groundHeight-5);
const offset=-(frame*speed)%24;
ctx.fillStyle='#b99346';
for(let x=offset;x<W;x+=24){
ctx.fillRect(x,gy+10,13,2);
ctx.fillRect(x+8,gy+17,8,2);
}
}

function drawParticles(){
particles.forEach(p=>{
ctx.fillStyle='rgba(255,255,255,'+Math.max(0,p.life)+')';
ctx.fillRect(p.x,p.y,p.size,p.size);
});
}

function draw(){
if(!W||!H)return;
ctx.clearRect(0,0,W,H);
drawSky();
clouds.forEach(drawCloud);
pipes.forEach(drawPipe);
drawGround();
drawBird();
drawParticles();
}

function finish(){
if(state==='over')return;
state='over';
countdownEl.classList.remove('show');
playGameOverSound();
if(Math.floor(score)>best){
best=Math.floor(score);
try{localStorage.setItem('flappy_bird_best',String(best));}catch(e){}
}
finalEl.textContent=String(Math.floor(score));
overEl.classList.add('show');
updateUI();
}

function updateClouds(dt){
clouds.forEach(c=>{
c.x-=c.speed*dt;
if(c.x+c.w<-20){
c.w=42+Math.random()*38;
c.h=c.w*.42;
c.x=W+20+Math.random()*90;
c.y=18+Math.random()*65;
c.speed=.12+Math.random()*.13;
c.alpha=.72+Math.random()*.16;
}
});
}

function update(dt,dtMs){
if(state==='over'||state==='idle')return;

frame++;
bird.wing+=dt*.35;
updateClouds(dt);

// Fase 1: Jeda Hitung Mundur 3 - 2 - 1 (burung melayang aman di tengah)
if(state==='countdown'){
countdownMs-=dtMs;
bird.y=H*.44+Math.sin(frame*.12)*6;
bird.rotation=Math.sin(frame*.12)*.06;
const secLeft=Math.ceil(countdownMs/730);
if(secLeft>=1 && secLeft!==countdownLastSec){
countdownLastSec=secLeft;
countNumEl.textContent=String(secLeft);
playTickSound(false);
}
if(countdownMs<=0){
state='ready_hover';
graceHoverMs=1500;
countNumEl.textContent='GO!';
countSubEl.textContent='TAP SEKARANG UNTUK TERBANG!';
playTickSound(true);
}
return;
}

// Fase 2: Melayang aman sebentar setelah GO! sampai player tap pertama (atau max 1.5 detik lalu naik halus)
if(state==='ready_hover'){
graceHoverMs-=dtMs;
bird.y=H*.44+Math.sin(frame*.16)*7;
bird.rotation=0;
if(graceHoverMs<=0){
beginActivePlay(false);
}
return;
}

// Fase 3: Permainan aktif
bird.vy+=GRAVITY*dt;
bird.y+=bird.vy*dt;
bird.rotation=Math.max(-.42,Math.min(1.05,bird.vy*.058));

if(bird.y<0){bird.y=0;bird.vy=0;}
if(bird.y+bird.h>=H-groundHeight){
bird.y=H-groundHeight-bird.h;
finish();
return;
}

spawnTimer-=dt;
if(spawnTimer<=0){
createPipe();
spawnTimer=82+Math.random()*22;
}

pipes.forEach(p=>{
p.x-=speed*dt;
if(!p.passed && p.x+p.w<bird.x){
p.passed=true;
score++;
playScoreSound();
createParticles(bird.x,bird.y,8);
}
if(pipeCollision(p))finish();
});
pipes=pipes.filter(p=>p.x>-55);

particles.forEach(p=>{
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.life-=.045*dt;
});
particles=particles.filter(p=>p.life>0);

speed=Math.min(4.1,speed+.0006*dt);
updateUI();
}

function loop(t){
if(state==='idle'||state==='over'){rafId=0;return;}
if(!last)last=t;
const dtMs=Math.min(t-last,40);
const dt=dtMs/16.67;
last=t;
update(dt,dtMs);
draw();
if(state!=='idle'&&state!=='over'){
rafId=requestAnimationFrame(loop);
}else{
rafId=0;
}
}

canvas.addEventListener('pointerdown',function(e){
e.preventDefault();
flap();
});

startEl.addEventListener('pointerdown',function(e){
e.preventDefault();
e.stopPropagation();
startCountdown();
});

restartEl.addEventListener('pointerdown',function(e){
e.preventDefault();
e.stopPropagation();
startCountdown();
});

document.addEventListener('keydown',function(e){
if(e.code==='Space'||e.code==='ArrowUp'){
e.preventDefault();
flap();
}
});

window.addEventListener('resize',resize);
updateUI();
resize();
})();
</script>
