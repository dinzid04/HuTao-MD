<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcade Snake</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#0d1714;--panel:#13231e;--line:#1f3830;--ink:#ecfdf5;--muted:#86a89b;--accent:#10b981;--fruit:#f59e0b;--danger:#ef4444}
html,body{background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{width:100%;max-width:380px;margin:0 auto;padding:14px}
.shell{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:15px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:20px;font-weight:800;letter-spacing:-0.01em}
.stats{display:flex;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;text-align:center;min-width:64px}
.pill span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase}
.pill strong{font-size:15px;font-variant-numeric:tabular-nums}
.controls-top{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.speeds{display:flex;gap:4px}
.spd{min-height:36px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.spd.active{background:var(--accent);border-color:var(--accent);color:#042016}
.btn{min-height:36px;padding:0 12px;border-radius:7px;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn:active{transform:scale(.96)}
.canvas-box{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#09110e;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:1/1}
.overlay{position:absolute;inset:0;background:rgba(9,17,14,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;font-weight:800}
.overlay p{font-size:13px;color:var(--muted)}
.btn-start{min-height:44px;padding:0 20px;border-radius:9px;background:var(--accent);color:#042016;font-weight:800;font-size:14px}
.pad{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:216px;margin-inline:auto}
.pad button{min-height:48px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--ink)}
.pad button:active{background:var(--accent);color:#042016}
.pad .sp{visibility:hidden}
</style>
</head>
<body>
<main>
  <section class="shell" aria-label="Permainan Snake">
    <header>
      <h1>Arcade Snake</h1>
      <div class="stats">
        <div class="pill"><span>Skor</span><strong id="score">0</strong></div>
        <div class="pill"><span>Terbaik</span><strong id="best">0</strong></div>
      </div>
    </header>
    <div class="controls-top">
      <div class="speeds" role="group" aria-label="Kecepatan">
        <button class="spd" type="button" data-ms="160">Santai</button>
        <button class="spd active" type="button" data-ms="115">Normal</button>
        <button class="spd" type="button" data-ms="78">Cepat</button>
      </div>
      <button id="pauseBtn" class="btn" type="button">Jeda</button>
    </div>
    <div class="canvas-box" id="box">
      <canvas id="cv" width="320" height="320"></canvas>
      <div class="overlay show" id="overlay" role="dialog" aria-live="polite">
        <h2 id="ovTitle">Siap Bermain?</h2>
        <p id="ovMsg">Makan buah oranye untuk tumbuh dan raih skor tertinggi.</p>
        <button id="playBtn" class="btn-start" type="button">Mulai</button>
      </div>
    </div>
    <div class="pad" aria-label="Kontrol arah ular">
      <span class="sp"></span>
      <button type="button" data-d="0,-1" aria-label="Atas">&#9650;</button>
      <span class="sp"></span>
      <button type="button" data-d="-1,0" aria-label="Kiri">&#9664;</button>
      <button type="button" data-d="0,1" aria-label="Bawah">&#9660;</button>
      <button type="button" data-d="1,0" aria-label="Kanan">&#9654;</button>
    </div>
  </section>
</main>
<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovMsg = document.getElementById('ovMsg');
  const playBtn = document.getElementById('playBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const box = document.getElementById('box');

  const CELLS = 16, SZ = cv.width / CELLS;
  let snake = [], dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 }, food = { x: 10, y: 8 };
  let score = 0, best = 0, stepMs = 115, timer = null, running = false, paused = false;
  try { best = parseInt(localStorage.getItem('shiki_snake_best') || '0', 10) || 0; } catch {}
  bestEl.textContent = String(best);

  function spawnFood() {
    const open = [];
    for (let x = 0; x < CELLS; x++) {
      for (let y = 0; y < CELLS; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) open.push({ x, y });
      }
    }
    food = open.length ? open[Math.floor(Math.random() * open.length)] : { x: 0, y: 0 };
  }

  function draw() {
    ctx.fillStyle = '#09110e';
    ctx.fillRect(0, 0, cv.width, cv.height);
    for (let x = 0; x < CELLS; x++) {
      for (let y = 0; y < CELLS; y++) {
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = 'rgba(255,255,255,0.025)';
          ctx.fillRect(x * SZ, y * SZ, SZ, SZ);
        }
      }
    }
    // Buah
    const fx = food.x * SZ + SZ / 2, fy = food.y * SZ + SZ / 2;
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(fx, fy, SZ * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath();
    ctx.arc(fx - 2.5, fy - 2.5, 2.2, 0, Math.PI * 2);
    ctx.fill();

    // Tubuh ular
    snake.forEach((seg, i) => {
      const pad = i === 0 ? 1.5 : 2.2;
      const ratio = 1 - (i / (snake.length + 6)) * 0.45;
      ctx.fillStyle = i === 0 ? '#34d399' : `rgba(16,185,129,${ratio.toFixed(2)})`;
      ctx.beginPath();
      ctx.roundRect(seg.x * SZ + pad, seg.y * SZ + pad, SZ - pad * 2, SZ - pad * 2, i === 0 ? 6 : 4);
      ctx.fill();
      if (i === 0) {
        ctx.fillStyle = '#042016';
        const ex = seg.x * SZ + SZ / 2 + dir.x * 4;
        const ey = seg.y * SZ + SZ / 2 + dir.y * 4;
        ctx.beginPath();
        ctx.arc(ex - dir.y * 3.5, ey - dir.x * 3.5, 2, 0, Math.PI * 2);
        ctx.arc(ex + dir.y * 3.5, ey + dir.x * 3.5, 2, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function tick() {
    if (!running || paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.x >= CELLS || head.y < 0 || head.y >= CELLS || snake.some(s => s.x === head.x && s.y === head.y)) {
      running = false;
      clearInterval(timer);
      ovTitle.textContent = 'Menabrak!';
      ovMsg.textContent = 'Skor kamu ' + score + ' (Terbaik ' + best + ').';
      playBtn.textContent = 'Main Lagi';
      overlay.classList.add('show');
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      if (score > best) {
        best = score;
        bestEl.textContent = String(best);
        try { localStorage.setItem('shiki_snake_best', String(best)); } catch {}
      }
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function startGame() {
    snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    paused = false;
    running = true;
    scoreEl.textContent = '0';
    pauseBtn.textContent = 'Jeda';
    overlay.classList.remove('show');
    spawnFood();
    draw();
    clearInterval(timer);
    timer = setInterval(tick, stepMs);
  }

  function setDirection(nx, ny) {
    if (!running || paused) return;
    if (dir.x + nx === 0 && dir.y + ny === 0) return;
    nextDir = { x: nx, y: ny };
  }

  playBtn.addEventListener('click', startGame);
  pauseBtn.addEventListener('click', () => {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? 'Lanjut' : 'Jeda';
    if (paused) {
      ovTitle.textContent = 'Dijeda';
      ovMsg.textContent = 'Tekan Lanjut untuk meneruskan permainan.';
      playBtn.textContent = 'Ulangi';
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
    }
  });

  document.querySelectorAll('.spd').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.spd').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      stepMs = parseInt(btn.dataset.ms, 10) || 115;
      if (running) { clearInterval(timer); timer = setInterval(tick, stepMs); }
    });
  });

  document.querySelectorAll('[data-d]').forEach(btn => {
    btn.addEventListener('click', () => {
      const [x, y] = btn.dataset.d.split(',').map(Number);
      setDirection(x, y);
    });
  });

  let sx = 0, sy = 0;
  box.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  box.addEventListener('pointerup', e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) setDirection(dx > 0 ? 1 : -1, 0);
    else setDirection(0, dy > 0 ? 1 : -1);
  });

  window.addEventListener('keydown', e => {
    const map = { ArrowUp: [0,-1], w: [0,-1], ArrowDown: [0,1], s: [0,1], ArrowLeft: [-1,0], a: [-1,0], ArrowRight: [1,0], d: [1,0] };
    if (map[e.key]) { e.preventDefault(); setDirection(map[e.key][0], map[e.key][1]); }
    else if (e.key === ' ') { e.preventDefault(); if (!running) startGame(); else pauseBtn.click(); }
  });

  snake = [{ x: 6, y: 8 }, { x: 5, y: 8 }, { x: 4, y: 8 }];
  draw();
})();
</script>
</body>
</html>
