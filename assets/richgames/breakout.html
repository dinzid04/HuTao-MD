<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brick Breaker</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--ink:#f8fafc;--muted:#94a3b8;--accent:#f97316}
html,body{background:transparent;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow-x:hidden;touch-action:manipulation}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{width:100%;max-width:380px;margin:0 auto;padding:12px}
.shell{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
h1{font-size:19px;font-weight:800}
.hud{display:flex;gap:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;text-align:center;min-width:54px}
.stat span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase}
.stat strong{font-size:14px;font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px}
.tip{font-size:12px;color:var(--muted)}
.btn-sm{min-height:36px;padding:0 12px;border-radius:8px;font-size:12px;font-weight:700;background:var(--panel);border:1px solid var(--line)}
.arena{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#090e1c;touch-action:none}
canvas{display:block;width:100%;height:auto;aspect-ratio:4/5}
.overlay{position:absolute;inset:0;background:rgba(9,14,28,.86);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:18px}
.overlay.show{display:flex}
.overlay h2{font-size:20px;font-weight:800}
.overlay p{font-size:13px;color:var(--muted)}
.btn-primary{min-height:44px;padding:0 20px;border-radius:9px;background:var(--accent);color:#fff;font-weight:800;font-size:14px}
.ctrls{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls button{min-height:48px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:16px;font-weight:700}
.ctrls button:active{background:var(--accent);color:#fff}
</style>
</head>
<body>
<main>
  <section class="shell" aria-label="Permainan Brick Breaker">
    <header>
      <h1>Brick Breaker</h1>
      <div class="hud">
        <div class="stat"><span>Skor</span><strong id="score">0</strong></div>
        <div class="stat"><span>Lv</span><strong id="level">1</strong></div>
        <div class="stat"><span>Nyawa</span><strong id="lives">3</strong></div>
      </div>
    </header>
    <div class="bar">
      <span class="tip">Geser jari di layar atau tahan tombol</span>
      <button id="pauseBtn" class="btn-sm" type="button">Jeda</button>
    </div>
    <div class="arena" id="arena">
      <canvas id="cv" width="320" height="400"></canvas>
      <div class="overlay show" id="overlay" role="dialog" aria-live="polite">
        <h2 id="ovTitle">Brick Breaker</h2>
        <p id="ovMsg">Hancurkan seluruh batu bata untuk naik ke level berikutnya.</p>
        <button id="playBtn" class="btn-primary" type="button">Mulai</button>
      </div>
    </div>
    <div class="ctrls" aria-label="Kontrol papan pemantul">
      <button id="leftBtn" type="button" aria-label="Geser kiri">&#9664; Kiri</button>
      <button id="rightBtn" type="button" aria-label="Geser kanan">Kanan &#9654;</button>
    </div>
  </section>
</main>
<script>
(() => {
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const arena = document.getElementById('arena');
  const scoreEl = document.getElementById('score'), levelEl = document.getElementById('level'), livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay'), ovTitle = document.getElementById('ovTitle'), ovMsg = document.getElementById('ovMsg');
  const playBtn = document.getElementById('playBtn'), pauseBtn = document.getElementById('pauseBtn');
  const leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn');

  const W = cv.width, H = cv.height;
  const ROW_COLORS = ['#ef4444', '#f97316', '#f59e0b', '#10b981', '#38bdf8'];
  let paddle = { x: 120, w: 80, h: 12 }, ball = { x: 160, y: 320, vx: 3.2, vy: -3.6, r: 7 };
  let bricks = [], score = 0, level = 1, lives = 3, running = false, paused = false, rafId = 0;
  let moveL = false, moveR = false;

  function buildBricks(lv) {
    bricks = [];
    const rows = Math.min(5, 3 + Math.floor(lv / 2));
    const cols = 6, pad = 6, top = 34, bw = (W - pad * (cols + 1)) / cols, bh = 18;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const hp = r === 0 && lv >= 2 ? 2 : 1;
        bricks.push({ x: pad + c * (bw + pad), y: top + r * (bh + pad), w: bw, h: bh, hp, maxHp: hp, col: ROW_COLORS[r % ROW_COLORS.length] });
      }
    }
  }

  function resetBall() {
    paddle.w = Math.max(60, 84 - (level - 1) * 4);
    paddle.x = (W - paddle.w) / 2;
    const spd = Math.min(5.6, 3.4 + (level - 1) * 0.35);
    const angle = (Math.random() * 0.6 - 0.3);
    ball = { x: W / 2, y: H - 56, vx: Math.sin(angle) * spd, vy: -Math.cos(angle) * spd, r: 7 };
  }

  function syncHud() {
    scoreEl.textContent = String(score);
    levelEl.textContent = String(level);
    livesEl.textContent = String(lives);
  }

  function draw() {
    ctx.fillStyle = '#090e1c';
    ctx.fillRect(0, 0, W, H);
    bricks.forEach(b => {
      if (b.hp <= 0) return;
      ctx.fillStyle = b.col;
      ctx.globalAlpha = b.hp < b.maxHp ? 0.6 : 1;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (b.hp > 1) {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
      }
    });
    // Paddle
    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.roundRect(paddle.x, H - 32, paddle.w, paddle.h, 6);
    ctx.fill();
    // Ball
    ctx.fillStyle = '#f97316';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffedd5';
    ctx.beginPath();
    ctx.arc(ball.x - 2, ball.y - 2, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }

  function update() {
    if (!running) return;
    if (!paused) {
      if (moveL) paddle.x -= 6;
      if (moveR) paddle.x += 6;
      paddle.x = Math.max(6, Math.min(W - paddle.w - 6, paddle.x));

      ball.x += ball.vx;
      ball.y += ball.vy;

      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

      // Pantulan paddle
      if (ball.vy > 0 && ball.y + ball.r >= H - 32 && ball.y - ball.r <= H - 20 && ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
        const hitPos = ((ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2));
        const speed = Math.hypot(ball.vx, ball.vy);
        const angle = hitPos * 1.1;
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.abs(Math.cos(angle) * speed);
        ball.y = H - 32 - ball.r;
      }

      // Pantulan bata
      for (const b of bricks) {
        if (b.hp <= 0) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.hp--;
          score += b.hp === 0 ? 20 : 10;
          const overlapX = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
          const overlapY = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
          if (overlapX < overlapY) ball.vx = -ball.vx;
          else ball.vy = -ball.vy;
          syncHud();
          break;
        }
      }

      if (bricks.every(b => b.hp <= 0)) {
        level++;
        score += 100;
        buildBricks(level);
        resetBall();
        syncHud();
      }

      if (ball.y - ball.r > H) {
        lives--;
        syncHud();
        if (lives <= 0) {
          running = false;
          ovTitle.textContent = 'Game Over';
          ovMsg.textContent = 'Skor akhir ' + score + ' di Level ' + level + '.';
          playBtn.textContent = 'Main Lagi';
          overlay.classList.add('show');
          return;
        }
        resetBall();
      }
      draw();
    }
    rafId = requestAnimationFrame(update);
  }

  function start() {
    cancelAnimationFrame(rafId);
    score = 0; level = 1; lives = 3; paused = false; running = true;
    pauseBtn.textContent = 'Jeda';
    overlay.classList.remove('show');
    buildBricks(1);
    resetBall();
    syncHud();
    draw();
    rafId = requestAnimationFrame(update);
  }

  function moveToClientX(clientX) {
    if (!running || paused) return;
    const rect = cv.getBoundingClientRect();
    const x = ((clientX - rect.left) / rect.width) * W;
    paddle.x = Math.max(6, Math.min(W - paddle.w - 6, x - paddle.w / 2));
  }

  arena.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') moveToClientX(e.clientX); });
  arena.addEventListener('pointerdown', e => moveToClientX(e.clientX));

  const bindHold = (el, setter) => {
    el.addEventListener('pointerdown', () => setter(true));
    el.addEventListener('pointerup', () => setter(false));
    el.addEventListener('pointerleave', () => setter(false));
    el.addEventListener('pointercancel', () => setter(false));
  };
  bindHold(leftBtn, v => { moveL = v; });
  bindHold(rightBtn, v => { moveR = v; });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveL = true;
    if (e.key === 'ArrowRight' || e.key === 'd') moveR = true;
    if (e.key === ' ' && !running) start();
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') moveL = false;
    if (e.key === 'ArrowRight' || e.key === 'd') moveR = false;
  });

  playBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', () => {
    if (!running) return;
    paused = !paused;
    pauseBtn.textContent = paused ? 'Lanjut' : 'Jeda';
  });

  buildBricks(1);
  resetBall();
  draw();
})();
</script>
</body>
</html>
