<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Tangkap Bintang — HuTao - MD</title>
<style>

:root{
  --bg:#081024;--card:#101c3b;--card2:#172852;--ink:#f0f9ff;--soft:#bae6fd;
  --line:#243c73;--acc:#38bdf8;--acc2:#0ea5e9;--warn:#fbbf24;--red:#ef4444;--blue:#3b82f6;
  --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{background:transparent;color:var(--ink);font-family:var(--sys);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
.stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0;width:100%;}
.app{
  width:100%;max-width:100%;border-radius:14px;overflow:hidden;position:relative;
  background:radial-gradient(circle at 85% 0%,rgba(56,189,248,.18) 0%,transparent 48%),
             radial-gradient(circle at 10% 100%,rgba(251,191,36,.14) 0%,transparent 52%),
             linear-gradient(180deg,#0e1a38 0%,#081024 100%);
  border:1px solid #243c73;
  box-shadow:0 16px 36px rgba(0,0,0,.6);
  padding:10px;
}
.top{display:flex;align-items:center;gap:9px;margin-bottom:10px;}
.logo{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#38bdf8,#0ea5e9);
  color:#041a2b;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:16px;
}
.meta{min-width:0;flex:1;}
.title{font-size:14.5px;font-weight:800;letter-spacing:.2px;color:var(--ink);}
.sub{font-size:10.5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.chip.on{background:var(--acc);border-color:var(--acc);color:#041a2b;}
.btn{border:0;border-radius:10px;padding:10px 12px;font-size:13px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,#38bdf8,#0ea5e9);color:#041a2b;}
.btn.alt{background:var(--card2);color:var(--ink);border:1px solid var(--line);}
.btn.red{background:#ef4444;color:#fff;}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font-size:14px;outline:none;font-family:var(--sys);}
.inp:focus{border-color:var(--acc);}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.row{display:flex;gap:8px;align-items:center;}
.muted{color:var(--soft);font-size:11px;}
.hide{display:none!important;}

.hud{display:flex;justify-content:space-between;gap:6px;margin-bottom:10px;}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 8px;text-align:center;}
.stat b{display:block;font-size:15px;color:#fff;}
.stat span{font-size:10px;color:var(--soft);}
canvas{display:block;width:100%;border-radius:13px;background:#0b0714;border:1px solid var(--line);touch-action:none;}
.row{display:flex;gap:8px;margin-top:10px;}
.row .btn{flex:1;}

</style>
</head>
<body>
<div class="stage"><div class="app">
  <div class="top">
    <div class="logo">🌠</div>
    <div class="meta">
      <div class="title">Tangkap Bintang</div>
      <div class="sub">Geser keranjang, hindari bom!</div>
    </div>
  </div>
  <div class="hud">
    <div class="stat"><b id="sc">0</b><span>Skor</span></div>
    <div class="stat"><b id="hp">❤️❤️❤️</b><span>Nyawa</span></div>
    <div class="stat"><b id="hi">0</b><span>Rekor</span></div>
  </div>
  <canvas id="cv" width="320" height="360"></canvas>
  <div class="row"><button class="btn" id="sbtn" onclick="startGame()">▶ Mulai</button></div>
</div></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=320,H=360;
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch{return d}}function lsSet(k,v){try{localStorage.setItem(k,v)}catch{}}
let px=125,items=[],sc=0,hp=3,hi=+lsGet('el_catch_hi',0),fr=0,on=false;
const sbtn=document.getElementById('sbtn');
document.getElementById('hi').textContent=hi;
function drawIdle(){ctx.fillStyle='#070d1f';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#38bdf8';ctx.fillRect(px,cv.height-22,56,10);ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillText('Tap ▶ Mulai untuk bermain',cv.width/2,cv.height/2);}
function startGame(){if(on)return;on=true;items=[];sc=0;hp=3;fr=0;sbtn.disabled=true;sbtn.style.opacity='.45';sbtn.textContent='🎮 Sedang Bermain...';upd();tick();}
function upd(){document.getElementById('sc').textContent=sc;document.getElementById('hp').textContent='❤️'.repeat(Math.max(0,hp))||'💀';if(sc>hi){hi=sc;lsSet('el_catch_hi',hi);document.getElementById('hi').textContent=hi;}}
function moveTo(x){const r=cv.getBoundingClientRect();px=Math.max(0,Math.min(W-70,(x-r.left)*(W/r.width)-35));}
cv.addEventListener('touchmove',e=>{e.preventDefault();moveTo(e.touches[0].clientX);},{passive:false});
cv.addEventListener('mousemove',e=>moveTo(e.clientX));
function tick(){
  ctx.fillStyle='#070d1f';ctx.fillRect(0,0,W,H);
  if(hp>0){
    fr++;if(fr%34===0)items.push({x:20+Math.random()*(W-40),y:-10,vy:2.4+sc/180,bad:Math.random()<.28});
    items.forEach(it=>{it.y+=it.vy;});
    items=items.filter(it=>{
      if(it.y>H-32&&it.y<H-10&&it.x>px&&it.x<px+70){if(it.bad)hp--;else sc+=10;upd();return false;}
      return it.y<H+10;
    });
  }
  ctx.fillStyle='#38bdf8';ctx.fillRect(px,H-24,70,12);
  ctx.font='20px sans-serif';ctx.textAlign='center';
  items.forEach(it=>ctx.fillText(it.bad?'☄️':'🌸',it.x,it.y));
  if(hp<=0){ctx.fillStyle='rgba(12,7,22,.8)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.fillText('GAME OVER • '+sc,W/2,H/2);}
  requestAnimationFrame(tick);
}
upd();drawIdle();
</script>
</body>
</html>
